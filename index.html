<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loome Social</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent-color: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        header {
            height: 56px;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .main-content {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .view-panel {
            display: none;
            width: 100%;
            height: 100%;
            padding: 12px;
            overflow-y: auto;
            position: absolute;
            top: 0;
            left: 0;
        }

        .view-panel.active {
            display: flex;
            flex-direction: column;
        }

        /* Bottom Navigation Bar (4 Items Only) */
        .bottom-nav {
            height: 60px;
            background-color: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-shrink: 0;
            z-index: 100;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75rem;
            gap: 3px;
            cursor: pointer;
            width: 25%;
        }

        .nav-btn .icon { font-size: 1.2rem; }
        .nav-btn.active { color: var(--accent-color); font-weight: bold; }

        input[type="text"], select, textarea {
            width: 100%;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .btn-audio {
            background-color: #8b5cf6;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
        }

        .chat-box {
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 10px;
        }

        .messages-list {
            flex: 1;
            background-color: var(--bg-secondary);
            border-radius: 10px;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid var(--border-color);
        }

        .msg-bubble {
            background-color: var(--border-color);
            padding: 10px;
            border-radius: 10px;
            max-width: 85%;
            font-size: 0.9rem;
            align-self: flex-start;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .msg-bubble.self {
            align-self: flex-end;
            background-color: #1e3a8a;
        }

        .msg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .file-attach-btn {
            background: #334155;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            font-size: 1.1rem;
        }

        .file-badge {
            background: rgba(255,255,255,0.1);
            padding: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: #60a5fa;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        audio {
            width: 100%;
            height: 36px;
            margin-top: 4px;
        }

        .video-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            height: 100%;
        }

        #localVideo {
            width: 100%;
            max-height: 70%;
            background: #000;
            border-radius: 10px;
            object-fit: cover;
        }

        .card {
            background-color: var(--bg-secondary);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
        }

        .room-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .room-title-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: right;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title" id="page-title">الدردشة العامة</div>
        <button class="btn-primary" style="padding: 4px 10px; font-size: 0.8rem;" onclick="switchView('video-call')">📹 فيديو</button>
    </header>

    <div class="main-content">

        <!-- 1. Public Chat Panel -->
        <div id="public-chat" class="view-panel active">
            <div class="chat-box">
                <div class="messages-list" id="public-msgs">
                    <div class="msg-bubble">مرحباً بك في غرفة المحادثة العامة!</div>
                </div>
                
                <div style="display: flex; gap: 6px; align-items: center;">
                    <label class="file-attach-btn" title="إرفاق ملف">
                        📎
                        <input type="file" id="public-file" accept=".pdf,.doc,.docx,.xls,.xlsx" style="display:none;" onchange="handleFileUpload(this, 'public')">
                    </label>
                    <button id="record-btn-public" class="btn-audio" onclick="toggleRecording('public')" title="تسجيل صوت">🎙️</button>
                    <input type="text" id="public-input" placeholder="اكتب رسالتك...">
                    <button class="btn-primary" onclick="sendPublicMsg()">إرسال</button>
                </div>
            </div>
        </div>

        <!-- 2. Private Chat Panel -->
        <div id="private-chat" class="view-panel">
            <div class="card">
                <h4 style="margin-bottom:8px;">إرسال رسالة خاصة</h4>
                <select id="pm-recipient" style="margin-bottom:8px;">
                    <option value="أحمد (المدير)">أحمد (المدير)</option>
                    <option value="سارة (دعم)">سارة (دعم)</option>
                </select>
                <textarea id="pm-text" rows="2" placeholder="اكتب الرسالة..." style="margin-bottom:8px;"></textarea>
                
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div style="display:flex; gap:6px;">
                        <label class="file-attach-btn">
                            📎
                            <input type="file" id="pm-file" accept=".pdf,.doc,.docx,.xls,.xlsx" style="display:none;" onchange="handleFileUpload(this, 'private')">
                        </label>
                        <button id="record-btn-private" class="btn-audio" onclick="toggleRecording('private')">🎙️</button>
                    </div>
                    <button class="btn-primary" onclick="sendPrivateMsg()">إرسال خاص</button>
                </div>
            </div>

            <div class="card" style="flex:1; overflow-y:auto;">
                <h4 style="margin-bottom:8px;">السجل الخاص</h4>
                <div id="pm-list" style="display:flex; flex-direction:column; gap:8px;"></div>
            </div>
        </div>

        <!-- 3. Rooms Management & Access -->
        <div id="rooms" class="view-panel">
            <div class="card">
                <h4 style="margin-bottom:8px;">إنشاء غرفة جديدة</h4>
                <div style="display:flex; gap:6px;">
                    <input type="text" id="new-room-name" placeholder="اسم الغرفة الجديد...">
                    <button class="btn-primary" onclick="createRoom()">إنشاء</button>
                </div>
            </div>

            <div class="card" style="flex:1;">
                <h4 style="margin-bottom:8px;">الغرف المتاحة (اضغط للدخول)</h4>
                <div id="rooms-list">
                    <div class="room-item" id="room-1">
                        <button class="room-title-btn" onclick="enterRoom('غرفة المناقشة العامة')">💬 غرفة المناقشة العامة</button>
                        <button class="btn-danger" onclick="deleteRoom('room-1')">حذف</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. Native Video Call -->
        <div id="video-call" class="view-panel">
            <div class="video-container">
                <video id="localVideo" autoplay playsinline muted></video>
                <div style="display:flex; gap:10px;">
                    <button class="btn-primary" style="background:#10b981;" onclick="startNativeVideo()">بدء الكاميرا المباشرة</button>
                    <button class="btn-danger" onclick="stopNativeVideo()">إيقاف</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation Bar (No Games) -->
    <div class="bottom-nav">
        <button class="nav-btn active" id="btn-public" onclick="switchView('public-chat')">
            <span class="icon">💬</span><span>العامة</span>
        </button>
        <button class="nav-btn" id="btn-private" onclick="switchView('private-chat')">
            <span class="icon">🔒</span><span>خاص</span>
        </button>
        <button class="nav-btn" id="btn-rooms" onclick="switchView('rooms')">
            <span class="icon">🚪</span><span>الغرف</span>
        </button>
        <button class="nav-btn" id="btn-video" onclick="switchView('video-call')">
            <span class="icon">📹</span><span>فيديو</span>
        </button>
    </div>

    <script>
        let selectedFile = { public: null, private: null };
        let audioBlob = { public: null, private: null };
        let mediaRecorder = null;
        let audioChunks = [];
        let activeRecordType = null;

        function switchView(viewId) {
            document.querySelectorAll('.view-panel').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(viewId).classList.add('active');

            const titleMap = {
                'public-chat': 'الدردشة العامة',
                'private-chat': 'الرسائل الخاصة',
                'rooms': 'إدارة وتصفح الغرف',
                'video-call': 'الفيديو المباشر'
            };
            document.getElementById('page-title').innerText = titleMap[viewId];

            const navMap = {
                'public-chat': 'btn-public',
                'private-chat': 'btn-private',
                'rooms': 'btn-rooms',
                'video-call': 'btn-video'
            };
            if(navMap[viewId]) document.getElementById(navMap[viewId]).classList.add('active');
        }

        // Room Entry Logic
        function enterRoom(roomName) {
            document.getElementById('page-title').innerText = roomName;
            switchView('public-chat');
            const box = document.getElementById('public-msgs');
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            bubble.style.backgroundColor = '#334155';
            bubble.innerText = `انضممت الآن إلى: ${roomName}`;
            box.appendChild(bubble);
            box.scrollTop = box.scrollHeight;
        }

        // Audio Recording System
        async function toggleRecording(type) {
            const btn = document.getElementById(`record-btn-${type}`);
            
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                btn.innerText = "🎙️";
                btn.style.backgroundColor = "#8b5cf6";
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    activeRecordType = type;

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        audioBlob[type] = new Blob(audioChunks, { type: 'audio/mp3' });
                        alert('تم تسجيل المقطع الصوتي وجاهز للإرسال!');
                    };

                    mediaRecorder.start();
                    btn.innerText = "⏹️ (جاري التسجيل)";
                    btn.style.backgroundColor = "#ef4444";
                } catch (err) {
                    alert('تعذر استخدام الميكروفون: ' + err.message);
                }
            }
        }

        function handleFileUpload(input, type) {
            if(input.files && input.files[0]) {
                selectedFile[type] = input.files[0];
                alert('تم إرفاق الملف: ' + input.files[0].name);
            }
        }

        // Send Public Msg
        function sendPublicMsg() {
            const input = document.getElementById('public-input');
            const file = selectedFile.public;
            const audio = audioBlob.public;
            if(!input.value.trim() && !file && !audio) return;

            const msgId = 'msg-' + Date.now();
            const box = document.getElementById('public-msgs');
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble self';
            bubble.id = msgId;

            let content = `<div class="msg-header"><span>أنت</span> <button class="btn-danger" onclick="deleteMessage('${msgId}')">🗑️</button></div>`;
            if(input.value.trim()) content += `<div>${input.value}</div>`;
            if(file) {
                const fileUrl = URL.createObjectURL(file);
                content += `<a class="file-badge" href="${fileUrl}" download="${file.name}">📄 ${file.name}</a>`;
            }
            if(audio) {
                const audioUrl = URL.createObjectURL(audio);
                content += `<audio controls src="${audioUrl}"></audio>`;
            }

            bubble.innerHTML = content;
            box.appendChild(bubble);

            input.value = '';
            selectedFile.public = null;
            audioBlob.public = null;
            document.getElementById('public-file').value = '';
            box.scrollTop = box.scrollHeight;
        }

        // Send Private Msg
        function sendPrivateMsg() {
            const recipient = document.getElementById('pm-recipient').value;
            const text = document.getElementById('pm-text').value;
            const file = selectedFile.private;
            const audio = audioBlob.private;
            if(!text.trim() && !file && !audio) return;

            const msgId = 'msg-' + Date.now();
            const list = document.getElementById('pm-list');
            const card = document.createElement('div');
            card.className = 'msg-bubble self';
            card.style.width = '100%';
            card.id = msgId;

            let content = `<div class="msg-header"><span>إلى ${recipient}</span> <button class="btn-danger" onclick="deleteMessage('${msgId}')">🗑️</button></div>`;
            if(text.trim()) content += `<div>${text}</div>`;
            if(file) {
                const fileUrl = URL.createObjectURL(file);
                content += `<a class="file-badge" href="${fileUrl}" download="${file.name}">📄 ${file.name}</a>`;
            }
            if(audio) {
                const audioUrl = URL.createObjectURL(audio);
                content += `<audio controls src="${audioUrl}"></audio>`;
            }

            card.innerHTML = content;
            list.prepend(card);

            document.getElementById('pm-text').value = '';
            selectedFile.private = null;
            audioBlob.private = null;
            document.getElementById('pm-file').value = '';
        }

        function deleteMessage(id) {
            const msgEl = document.getElementById(id);
            if(msgEl && confirm('هل تريد حذف هذه الرسالة؟')) {
                msgEl.remove();
            }
        }

        // Rooms Management
        function createRoom() {
            const input = document.getElementById('new-room-name');
            if(!input.value.trim()) return;

            const roomName = input.value;
            const roomId = 'room-' + Date.now();
            const list = document.getElementById('rooms-list');
            const item = document.createElement('div');
            item.className = 'room-item';
            item.id = roomId;
            item.innerHTML = `
                <button class="room-title-btn" onclick="enterRoom('${roomName}')">💬 ${roomName}</button>
                <button class="btn-danger" onclick="deleteRoom('${roomId}')">حذف</button>
            `;

            list.appendChild(item);
            input.value = '';
        }

        function deleteRoom(id) {
            const roomEl = document.getElementById(id);
            if(roomEl && confirm('هل أنت تأكد من حذف هذه الغرفة؟')) {
                roomEl.remove();
            }
        }

        // Native Video WebRTC
        let localStream = null;
        async function startNativeVideo() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
            } catch (err) {
                alert('تعذر الوصول للكاميرا: ' + err.message);
            }
        }

        function stopNativeVideo() {
            if(localStream) {
                localStream.getTracks().forEach(track => track.stop());
                document.getElementById('localVideo').srcObject = null;
            }
        }
    </script>
</body>
</html>
