<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التواصل والمهام المباشرة</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --primary: #0084ff;
            --primary-hover: #006bce;
            --chat-bg: #ffffff;
            --text-color: #050505;
            --border-color: #e4e6eb;
            --msg-me: #0084ff;
            --msg-other: #e4e6eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Auth Screen */
        #auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .auth-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 350px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .auth-box h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .auth-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .auth-box button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .auth-box button:hover {
            background: var(--primary-hover);
        }

        /* Main Layout */
        #app-container {
            display: flex;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background: white;
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .user-header {
            padding: 15px;
            background: #f8f9fa;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: bold;
        }

        .tab-btn.active {
            border-bottom: 3px solid var(--primary);
            color: var(--primary);
        }

        .panel {
            flex: 1;
            overflow-y: auto;
            display: none;
            padding: 10px;
        }

        .panel.active {
            display: block;
        }

        /* Members List */
        .member-item {
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .member-item:hover {
            background: #f5f5f5;
        }

        .call-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Chat Window */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #e5ddd5;
        }

        .chat-header {
            padding: 15px;
            background: white;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 60%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.me {
            align-self: flex-start;
            background: var(--msg-me);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.other {
            align-self: flex-end;
            background: var(--msg-other);
            color: black;
            border-bottom-left-radius: 2px;
        }

        .message .meta {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 4px;
            text-align: left;
        }

        /* Chat Controls */
        .chat-input-area {
            padding: 15px;
            background: white;
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid var(--border-color);
        }

        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            outline: none;
        }

        .action-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
        }

        /* Call Overlay */
        #call-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 2000;
        }

        .call-controls {
            margin-top: 30px;
            display: flex;
            gap: 20px;
        }

        .call-btn-danger {
            background: #f44336;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
        }

        /* Task Items */
        .task-item {
            padding: 10px;
            background: #f8f9fa;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-item .meta {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <!-- Auth Screen -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2>تسجيل الدخول</h2>
            <input type="text" id="username-input" placeholder="أدخل اسمك المعرف...">
            <button onclick="login()">دخول المنصة</button>
        </div>
    </div>

    <!-- Main Application -->
    <div id="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="user-header" id="current-user-display">غير مسجل</div>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('members')">الأعضاء</button>
                <button class="tab-btn" onclick="switchTab('tasks')">المهام</button>
            </div>
            <div id="members-panel" class="panel active">
                <div id="members-list"></div>
            </div>
            <div id="tasks-panel" class="panel">
                <div style="padding: 10px;">
                    <input type="text" id="task-input" placeholder="إضافة مهمة جديدة..." style="width:100%; padding:8px; margin-bottom:10px;">
                    <button onclick="addTask()" style="width:100%; padding:8px; background:#28a745; color:white; border:none; border-radius:4px; cursor:pointer;">إضافة</button>
                </div>
                <div id="tasks-list"></div>
            </div>
        </div>

        <!-- Chat Window -->
        <div class="chat-area">
            <div class="chat-header" id="chat-title">المحادثة العامة</div>
            <div class="chat-messages" id="messages-container"></div>
            <div class="chat-input-area">
                <input type="file" id="file-input" style="display: none;" onchange="uploadFile(this)">
                <button class="action-btn" onclick="document.getElementById('file-input').click()">📎</button>
                <button class="action-btn" id="record-btn" onclick="toggleRecording()">🎙️</button>
                <input type="text" id="message-input" placeholder="اكتب رسالة..." onkeypress="handleKeyPress(event)">
                <button class="action-btn" onclick="sendMessage()">➔</button>
            </div>
        </div>
    </div>

    <!-- Call Overlay -->
    <div id="call-overlay">
        <h2 id="call-status">جاري الاتصال...</h2>
        <audio id="remote-audio" autoplay></audio>
        <div class="call-controls">
            <button class="call-btn-danger" onclick="endCall()">إنهاء المكالمة</button>
        </div>
    </div>

    <script>
        // --- Supabase Configuration ---
        const SUPABASE_URL = 'https://gdmevluvrmexkkihcxce.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkbWV2bHV2cm1leGtraWhjeGNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NTI5ODIsImV4cCI6MjEwNDEyODk4Mn0.U1MA6q_GfuPpzkJCvMwTc07neAek1vsq5qWE44_eYQQ';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let activeChannel = null;
        let peerConnection = null;
        let localStream = null;
        let mediaRecorder = null;
        let audioChunks = [];

        // ICE Servers configuration
        const rtcConfig = {
            iceServers: [
                {
                    urls: 'stun:stun.l.google.com:19302'
                },
                {
                    urls: 'stun:stun1.l.google.com:19302'
                },
                {
                    urls: 'stun:stun2.l.google.com:19302'
                },
                {
                    urls: 'stun:stun3.l.google.com:19302'
                },
                {
                    urls: 'stun:stun4.l.google.com:19302'
                }
            ]
        };

        // --- Auth System ---
        function login() {
            const usernameInput = document.getElementById('username-input');
            const username = usernameInput.value.trim();
            
            if (!username) {
                alert('يرجى إدخال اسم صحيح');
                return;
            }
            
            currentUser = username;
            document.getElementById('current-user-display').innerText = `المستخدم: ${currentUser}`;
            document.getElementById('auth-screen').style.display = 'none';
            
            initSupabaseSubscriptions();
            loadMessages();
            loadTasks();
            registerPresence();
        }

        // --- Realtime Subscriptions ---
        function initSupabaseSubscriptions() {
            // Subscribe to Messages
            db.channel('public:messages')
                .on('postgres_changes', { 
                    event: 'INSERT', 
                    schema: 'public', 
                    table: 'messages' 
                }, payload => {
                    renderSingleMessage(payload.new);
                })
                .subscribe();

            // Subscribe to Tasks
            db.channel('public:tasks')
                .on('postgres_changes', { 
                    event: 'INSERT', 
                    schema: 'public', 
                    table: 'tasks' 
                }, payload => {
                    renderSingleTask(payload.new);
                })
                .subscribe();

            // Broadcast Channel for P2P Calls Signaling
            activeChannel = db.channel('call-signaling', { 
                config: { 
                    broadcast: { self: false } 
                } 
            });
            
            activeChannel.on('broadcast', { event: 'signal' }, async ({ payload }) => {
                if (payload.target !== currentUser) return;
                
                if (payload.type === 'offer') {
                    handleOffer(payload);
                } else if (payload.type === 'answer') {
                    handleAnswer(payload);
                } else if (payload.type === 'candidate') {
                    handleCandidate(payload);
                } else if (payload.type === 'end') {
                    resetCallUI();
                }
            }).subscribe();
        }

        // --- Presence & Members ---
        async function registerPresence() {
            const presenceChannel = db.channel('online-users', {
                config: { 
                    presence: { key: currentUser } 
                }
            });

            presenceChannel.on('presence', { event: 'sync' }, () => {
                const state = presenceChannel.presenceState();
                renderMembers(Object.keys(state));
            }).subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    await presenceChannel.track({ 
                        online_at: new Date().toISOString() 
                    });
                }
            });
        }

        function renderMembers(users) {
            const list = document.getElementById('members-list');
            list.innerHTML = '';
            
            users.forEach(user => {
                if (user === currentUser) return;
                
                const div = document.createElement('div');
                div.className = 'member-item';
                
                const nameSpan = document.createElement('span');
                nameSpan.innerText = user;
                
                const callBtn = document.createElement('button');
                callBtn.className = 'call-btn';
                callBtn.innerText = '📞 اتصال';
                callBtn.onclick = () => startCall(user);
                
                div.appendChild(nameSpan);
                div.appendChild(callBtn);
                list.appendChild(div);
            });
        }

        // --- Messaging System ---
        async function loadMessages() {
            const { data, error } = await db
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true });
                
            if (!error && data) {
                const container = document.getElementById('messages-container');
                container.innerHTML = '';
                data.forEach(msg => renderSingleMessage(msg));
            }
        }

        async function sendMessage(customContent = null) {
            const input = document.getElementById('message-input');
            const content = customContent || input.value.trim();
            
            if (!content) return;

            const { error } = await db
                .from('messages')
                .insert([
                    { 
                        sender: currentUser, 
                        content: content 
                    }
                ]);

            if (error) {
                console.error('Error sending message:', error);
            } else {
                if (!customContent) input.value = '';
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function renderSingleMessage(msg) {
            const container = document.getElementById('messages-container');
            const div = document.createElement('div');
            const isMe = msg.sender === currentUser;
            
            div.className = `message ${isMe ? 'me' : 'other'}`;
            
            let messageBody = msg.content;
            
            if (msg.content.startsWith('[AUDIO]:')) {
                const url = msg.content.replace('[AUDIO]:', '');
                messageBody = `<audio controls src="${url}"></audio>`;
            } else if (msg.content.startsWith('[FILE]:')) {
                const url = msg.content.replace('[FILE]:', '');
                messageBody = `<a href="${url}" target="_blank" style="color:inherit;">📄 عرض الملف المرفق</a>`;
            }

            div.innerHTML = `
                <div>${messageBody}</div>
                <div class="meta">${msg.sender}</div>
            `;
            
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // --- Storage (Voice & Files using 'chat-files' Bucket) ---
        async function toggleRecording() {
            const btn = document.getElementById('record-btn');
            
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = e => {
                        audioChunks.push(e.data);
                    };
                    
                    mediaRecorder.onstop = async () => {
                        btn.innerText = "⏳";
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const fileName = `voice_${Date.now()}.webm`;
                        
                        const { data, error } = await db.storage
                            .from('chat-files')
                            .upload(fileName, audioBlob);
                            
                        if (!error) {
                            const { data: publicUrl } = db.storage
                                .from('chat-files')
                                .getPublicUrl(fileName);
                                
                            sendMessage(`[AUDIO]:${publicUrl.publicUrl}`);
                        } else {
                            alert('خطأ في رفع التسجيل الصوتي.');
                            console.error(error);
                        }
                        btn.innerText = "🎙️";
                    };
                    
                    mediaRecorder.start();
                    btn.innerText = "⏹️";
                } catch (e) { 
                    alert('الوصول للميكروفون مفقود أو غير متاح'); 
                }
            }
        }

        async function uploadFile(input) {
            const file = input.files[0];
            if (!file) return;
            
            const fileName = `file_${Date.now()}_${file.name}`;
            const { data, error } = await db.storage
                .from('chat-files')
                .upload(fileName, file);
                
            if (!error) {
                const { data: publicUrl } = db.storage
                    .from('chat-files')
                    .getPublicUrl(fileName);
                    
                sendMessage(`[FILE]:${publicUrl.publicUrl}`);
            } else {
                alert('خطأ في رفع الملف.');
                console.error(error);
            }
        }

        // --- WebRTC Audio Calls ---
        async function startCall(targetUser) {
            document.getElementById('call-overlay').style.display = 'flex';
            document.getElementById('call-status').innerText = `جاري الاتصال بـ ${targetUser}...`;

            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.ontrack = e => {
                document.getElementById('remote-audio').srcObject = e.streams[0];
            };

            peerConnection.onicecandidate = e => {
                if (e.candidate) {
                    activeChannel.send({
                        type: 'broadcast', 
                        event: 'signal',
                        payload: { 
                            type: 'candidate', 
                            candidate: e.candidate, 
                            target: targetUser, 
                            sender: currentUser 
                        }
                    });
                }
            };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            activeChannel.send({
                type: 'broadcast', 
                event: 'signal',
                payload: { 
                    type: 'offer', 
                    offer: offer, 
                    target: targetUser, 
                    sender: currentUser 
                }
            });
        }

        async function handleOffer(payload) {
            if (!confirm(`مكالمة واردة من ${payload.sender}. هل ترغب بالرد؟`)) return;

            document.getElementById('call-overlay').style.display = 'flex';
            document.getElementById('call-status').innerText = `في مكالمة مع ${payload.sender}`;

            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.ontrack = e => {
                document.getElementById('remote-audio').srcObject = e.streams[0];
            };

            peerConnection.onicecandidate = e => {
                if (e.candidate) {
                    activeChannel.send({
                        type: 'broadcast', 
                        event: 'signal',
                        payload: { 
                            type: 'candidate', 
                            candidate: e.candidate, 
                            target: payload.sender, 
                            sender: currentUser 
                        }
                    });
                }
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            activeChannel.send({
                type: 'broadcast', 
                event: 'signal',
                payload: { 
                    type: 'answer', 
                    answer: answer, 
                    target: payload.sender, 
                    sender: currentUser 
                }
            });
        }

        async function handleAnswer(payload) {
            document.getElementById('call-status').innerText = `تم الاتصال بـ ${payload.sender}`;
            await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.answer));
        }

        async function handleCandidate(payload) {
            if (peerConnection) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(payload.candidate));
            }
        }

        function endCall() {
            if (activeChannel) {
                activeChannel.send({
                    type: 'broadcast', 
                    event: 'signal',
                    payload: { 
                        type: 'end', 
                        sender: currentUser 
                    }
                });
            }
            resetCallUI();
        }

        function resetCallUI() {
            if (peerConnection) {
                peerConnection.close();
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            peerConnection = null;
            localStream = null;
            document.getElementById('call-overlay').style.display = 'none';
        }

        // --- Tasks Management ---
        async function loadTasks() {
            const { data, error } = await db.from('tasks').select('*');
            if (!error && data) {
                const list = document.getElementById('tasks-list');
                list.innerHTML = '';
                data.forEach(t => renderSingleTask(t));
            }
        }

        async function addTask() {
            const input = document.getElementById('task-input');
            const title = input.value.trim();
            
            if (!title) return;
            
            const { error } = await db
                .from('tasks')
                .insert([
                    { 
                        title: title, 
                        created_by: currentUser 
                    }
                ]);
                
            if (!error) {
                input.value = '';
            }
        }

        function renderSingleTask(task) {
            const list = document.getElementById('tasks-list');
            const div = document.createElement('div');
            div.className = 'task-item';
            div.innerHTML = `
                <div>
                    <div>${task.title}</div>
                    <div class="meta">بواسطة: ${task.created_by}</div>
                </div>
            `;
            list.appendChild(div);
        }

        // --- Interface UI Handlers ---
        function switchTab(tabName) {
            const buttons = document.querySelectorAll('.tab-btn');
            const panels = document.querySelectorAll('.panel');
            
            buttons.forEach(b => b.classList.remove('active'));
            panels.forEach(p => p.classList.remove('active'));
            
            if (tabName === 'members') {
                buttons[0].classList.add('active');
                document.getElementById('members-panel').classList.add('active');
            } else {
                buttons[1].classList.add('active');
                document.getElementById('tasks-panel').classList.add('active');
            }
        }
    </script>
</body>
</html>
