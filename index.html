<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loome Cosmetics Factory</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --accent-color: #0d9488;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #475569;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --warning-color: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-primary); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
        
        /* Header Responsive Fix */
        header { 
            height: 60px; 
            background-color: var(--bg-secondary); 
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 8px; 
            flex-shrink: 0; 
            gap: 4px;
        }
        
        .header-right { display: flex; align-items: center; gap: 6px; overflow: hidden; }
        .menu-toggle { background: transparent; border: none; color: #fff; font-size: 1.4rem; padding: 4px 8px; cursor: pointer; }
        .factory-title { font-size: 0.85rem; font-weight: bold; color: #2dd4bf; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .header-left { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .user-badge { font-size: 0.7rem; color: #5eead4; background: rgba(13, 148, 136, 0.2); padding: 3px 6px; border-radius: 12px; border: 1px solid var(--accent-color); white-space: nowrap; }
        .zoom-btn { background: #0284c7; color: white; border: none; padding: 5px 8px; font-size: 0.75rem; font-weight: bold; border-radius: 6px; cursor: pointer; white-space: nowrap; }

        /* Main Container */
        .main-container { flex: 1; display: flex; overflow: hidden; position: relative; }
        
        /* Drawer Overlay */
        .overlay { display: none; position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); z-index: 40; }
        .overlay.active { display: block; }

        /* Mobile Responsive Sidebar */
        .sidebar { 
            width: 270px; 
            background-color: var(--bg-secondary); 
            border-left: 1px solid var(--border-color); 
            display: flex; 
            flex-direction: column; 
            position: absolute; 
            top: 0; bottom: 0; right: 0; 
            z-index: 50; 
            transform: translateX(100%); 
            transition: transform 0.25s ease-in-out; 
        }
        .sidebar.open { transform: translateX(0); }
        
        .dept-header { padding: 12px; font-weight: bold; font-size: 0.8rem; color: var(--text-muted); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .dept-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
        .dept-btn { background: transparent; border: none; color: var(--text-main); padding: 10px 12px; border-radius: 8px; text-align: right; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; width: 100%; }
        .dept-btn:hover, .dept-btn.active { background-color: var(--bg-card); color: #2dd4bf; font-weight: bold; }

        /* Content Area */
        .content-area { flex: 1; display: flex; flex-direction: column; position: relative; background: #0b1329; width: 100%; overflow: hidden; }
        
        /* Chat View */
        .chat-container { display: flex; flex-direction: column; height: 100%; width: 100%; }
        .chat-header { padding: 8px 12px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .messages-list { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        /* Bubbles */
        .msg-bubble { background-color: var(--bg-secondary); padding: 8px 12px; border-radius: 12px; max-width: 85%; font-size: 0.88rem; align-self: flex-start; border: 1px solid var(--border-color); }
        .msg-bubble.self { align-self: flex-end; background-color: #0f4c5c; border-color: #136f63; }
        .msg-info { font-size: 0.72rem; color: #2dd4bf; font-weight: bold; margin-bottom: 2px; }
        .msg-time { font-size: 0.65rem; color: var(--text-muted); text-align: left; margin-top: 4px; }
        
        /* Chat Input Area (Mobile Friendly) */
        .chat-input-bar { padding: 8px; background: var(--bg-secondary); border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
        .reactions-quick { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
        .react-btn { background: rgba(0,0,0,0.3); border: none; border-radius: 12px; padding: 3px 8px; font-size: 0.8rem; cursor: pointer; color: #fff; flex-shrink: 0; }

        .input-row { display: flex; gap: 6px; align-items: center; width: 100%; }
        input[type="text"] { flex: 1; background-color: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 10px; border-radius: 8px; outline: none; font-size: 0.85rem; min-width: 0; }
        
        .action-btn { background-color: var(--accent-color); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.8rem; flex-shrink: 0; }
        .file-label { background: var(--bg-card); color: #fff; padding: 8px 10px; border-radius: 8px; cursor: pointer; border: 1px solid var(--border-color); flex-shrink: 0; font-size: 0.9rem; }

        /* Panels */
        .panel { display: none; padding: 12px; overflow-y: auto; height: 100%; width: 100%; }
        .panel.active { display: block; }
        .card { background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .form-control { background: var(--bg-primary); border: 1px solid var(--border-color); color: #fff; padding: 8px; border-radius: 6px; font-size: 0.85rem; width: 100%; }

        .table-responsive { overflow-x: auto; width: 100%; }
        .table { width: 100%; border-collapse: collapse; min-width: 320px; }
        .table th, .table td { padding: 8px; border: 1px solid var(--border-color); text-align: right; font-size: 0.8rem; }
        .table th { background: var(--bg-card); color: #2dd4bf; }
    </style>
</head>
<body>

    <header>
        <div class="header-right">
            <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
            <div class="factory-title">🏭 Loome Cosmetics</div>
        </div>
        <div class="header-left">
            <span class="user-badge" id="current-user-display">المدير العام</span>
            <button class="zoom-btn" onclick="openVideoCall()">📹 Zoom</button>
        </div>
    </header>

    <div class="main-container">
        
        <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

        <!-- Sidebar Navigation -->
        <div class="sidebar" id="sidebar">
            <div class="dept-header">
                <span>إدارات المصنع</span>
                <button style="background:none; border:none; color:#fff; font-size:1.1rem;" onclick="toggleSidebar()">✕</button>
            </div>
            <div class="dept-list">
                <button class="dept-btn active" onclick="switchDepartment('production', '🏭 إدارة الإنتاج والتخطيط')">🏭 الإنتاج والتخطيط</button>
                <button class="dept-btn" onclick="switchDepartment('qc_qa', '🧪 الجودة والمعامل')">🧪 الجودة والمعامل (QC/QA)</button>
                <button class="dept-btn" onclick="switchDepartment('inventory', '📦 المخازن والمشتريات')">📦 المخازن والمشتريات</button>
                <button class="dept-btn" onclick="switchDepartment('admin_hr', '👔 الشؤون الإدارية')">👔 الشؤون الإدارية (HR)</button>
                <button class="dept-btn" onclick="switchDepartment('finance', '💰 الإدارة المالية')">💰 الإدارة المالية</button>
                <button class="dept-btn" onclick="switchDepartment('general', '💬 القناة العامة')">💬 القناة العامة</button>
                
                <div style="margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border-color);">
                    <button class="dept-btn" style="color: var(--warning-color);" onclick="showPanel('team-management')">👥 إدارة أعضاء الفريق</button>
                </div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="content-area">
            
            <!-- Chat Panel -->
            <div id="chat-panel" class="chat-container">
                <div class="chat-header">
                    <h3 id="current-dept-title" style="font-size: 0.88rem; color: #2dd4bf;">🏭 إدارة الإنتاج والتخطيط</h3>
                    <span style="font-size:0.68rem; color:var(--text-muted);">خاص بالمصنع</span>
                </div>

                <div class="messages-list" id="chat-msgs"></div>

                <div class="chat-input-bar">
                    <div class="reactions-quick">
                        <button class="react-btn" onclick="addEmoji('👍')">👍</button>
                        <button class="react-btn" onclick="addEmoji('✅')">✅</button>
                        <button class="react-btn" onclick="addEmoji('⚠️')">⚠️</button>
                        <button class="react-btn" onclick="addEmoji('🧪')">🧪</button>
                        <button class="react-btn" onclick="addEmoji('📦')">📦</button>
                    </div>
                    <form onsubmit="event.preventDefault(); sendMessage();" class="input-row">
                        <label class="file-label" title="إرفاق ملف">
                            📎
                            <input type="file" id="chat-file" style="display:none;" onchange="handleFileUpload(this)">
                        </label>
                        <button type="button" id="record-btn" class="action-btn" style="background:#6366f1;" onclick="toggleRecording()">🎙️</button>
                        <input type="text" id="chat-input" placeholder="اكتب ملاحظة أو أمر...">
                        <button type="submit" class="action-btn">إرسال</button>
                    </form>
                </div>
            </div>

            <!-- Team Management Panel -->
            <div id="team-management" class="panel">
                <div class="card">
                    <h4 style="color:#2dd4bf; margin-bottom:10px; font-size:0.9rem;">إضافة عضو جديد للفريق</h4>
                    <div class="form-group">
                        <input type="text" id="new-user-name" class="form-control" placeholder="اسم الموظف...">
                        <input type="text" id="new-user-role" class="form-control" placeholder="المسمى الوظيفي (مثال: كيميائي معمل)...">
                        <select id="new-user-dept" class="form-control">
                            <option value="production">إدارة الإنتاج والتخطيط</option>
                            <option value="qc_qa">الجودة والمعامل</option>
                            <option value="inventory">المخازن والمشتريات</option>
                            <option value="admin_hr">الشؤون الإدارية</option>
                            <option value="finance">الإدارة المالية</option>
                        </select>
                        <button class="action-btn" style="width:100%;" onclick="addNewMember()">+ إضافة الموظف</button>
                    </div>
                </div>

                <div class="card">
                    <h4 style="color:#2dd4bf; margin-bottom:10px; font-size:0.9rem;">قائمة فريق العمل</h4>
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>اسم الموظف</th>
                                    <th>الوظيفة</th>
                                    <th>القسم</th>
                                    <th>إجراء</th>
                                </tr>
                            </thead>
                            <tbody id="team-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Video Meeting Panel -->
            <div id="video-panel" class="panel">
                <div class="card" style="text-align:center;">
                    <h4 style="color:#2dd4bf; margin-bottom:8px;">غرفة الاجتماعات المرئية</h4>
                    <video id="groupVideoPlayer" autoplay playsinline muted style="width:100%; max-height:300px; background:#000; border-radius:8px; object-fit:cover; margin-bottom:10px;"></video>
                    <div style="display:flex; justify-content:center; gap:8px;">
                        <button class="action-btn" style="background:var(--success-color);" onclick="startCamera()">تفعيل الكاميرا</button>
                        <button class="action-btn" style="background:var(--danger-color);" onclick="stopCamera()">إغلاق</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gdmevluvrmexkkihcxce.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkbWV2bHV2cm1leGtraWhjeGNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NTI5ODIsImV4cCI6MjEwNDEyODk4Mn0.U1MA6q_GfuPpzkJCvMwTc07neAek1vsq5qWE44_eYQQ';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentDept = 'production';
        let myUsername = 'المدير العام';
        let mediaRecorder = null, audioChunks = [], recordedAudioBlob = null;
        let localStream = null;

        let teamMembers = [
            { id: 1, name: 'أحمد محمود', role: 'مدير إنتاج', dept: 'production' },
            { id: 2, name: 'د. سارة علي', role: 'مدير الجودة QC', dept: 'qc_qa' },
            { id: 3, name: 'محمود حسن', role: 'أمين المخازن', dept: 'inventory' }
        ];

        function initApp() {
            let saved = localStorage.getItem('loome_factory_user');
            if(saved) myUsername = saved;
            document.getElementById('current-user-display').innerText = myUsername;
            renderTeamTable();
            loadMessages();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }

        function switchDepartment(deptKey, title) {
            currentDept = deptKey;
            document.getElementById('current-dept-title').innerText = title;
            document.querySelectorAll('.dept-btn').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            showPanel('chat-panel');
            loadMessages();
            toggleSidebar();
        }

        function showPanel(panelId) {
            document.getElementById('chat-panel').style.display = panelId === 'chat-panel' ? 'flex' : 'none';
            document.getElementById('team-management').classList.remove('active');
            document.getElementById('video-panel').classList.remove('active');

            if(panelId !== 'chat-panel') {
                document.getElementById(panelId).classList.add('active');
            }
        }

        async function loadMessages() {
            const { data } = await db.from('messages').select('*').order('created_at', { ascending: true });
            const list = document.getElementById('chat-msgs');
            list.innerHTML = '';
            if(data) {
                data.forEach(msg => {
                    if(msg.room_id === currentDept || (!msg.room_id && currentDept === 'production')) {
                        renderMessageUI(msg);
                    }
                });
            }
        }

        db.channel('factory:messages').on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, payload => {
            if (payload.eventType === 'DELETE') {
                const el = document.getElementById('msg-' + payload.old.id);
                if (el) el.remove();
            } else if(payload.new.room_id === currentDept) {
                renderMessageUI(payload.new);
            }
        }).subscribe();

        function renderMessageUI(msg) {
            const list = document.getElementById('chat-msgs');
            const msgKey = msg.id ? 'msg-' + msg.id : 'msg-temp-' + Date.now();
            let bubble = document.getElementById(msgKey);

            if(!bubble) {
                bubble = document.createElement('div');
                bubble.id = msgKey;
                list.appendChild(bubble);
            }

            const isSelf = msg.username === myUsername;
            bubble.className = `msg-bubble ${isSelf ? 'self' : ''}`;

            let contentText = msg.content || '';
            let audioUrl = msg.audio_url;
            let fileUrl = msg.file_url;

            if(contentText.startsWith('[AUDIO]:')) {
                audioUrl = contentText.replace('[AUDIO]:', '').trim();
                contentText = '';
            } else if(contentText.startsWith('[FILE]:')) {
                fileUrl = contentText.replace('[FILE]:', '').trim();
                contentText = '';
            }

            let html = `
                <div class="msg-info">${msg.username || 'عضو'}</div>
                <div>${contentText}</div>
            `;

            if(audioUrl) html += `<audio controls src="${audioUrl}" style="width:100%; margin-top:4px; height:30px;"></audio>`;
            if(fileUrl) html += `<a href="${fileUrl}" target="_blank" style="color:#60a5fa; margin-top:4px; display:inline-block; font-size:0.8rem; font-weight:bold;">📄 الملف المرفق</a>`;

            if(isSelf && msg.id) {
                html += `
                    <div style="display:flex; gap:8px; font-size:0.7rem; margin-top:4px; border-top:1px solid rgba(255,255,255,0.1); padding-top:2px;">
                        <button style="background:none; border:none; color:var(--danger-color); cursor:pointer;" onclick="deleteMsg('${msg.id}')">حذف</button>
                    </div>
                `;
            }

            html += `<div class="msg-time">${new Date(msg.created_at || Date.now()).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'})}</div>`;
            bubble.innerHTML = html;
            list.scrollTop = list.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const messageText = input.value.trim();

            if(recordedAudioBlob) {
                const reader = new FileReader();
                reader.readAsDataURL(recordedAudioBlob);
                reader.onloadend = async () => {
                    sendPayload(`[AUDIO]:${reader.result}`);
                };
                recordedAudioBlob = null;
                return;
            }

            if(messageText) {
                sendPayload(messageText);
                input.value = '';
            }
        }

        async function sendPayload(content) {
            renderMessageUI({ username: myUsername, content: content, room_id: currentDept, created_at: new Date().toISOString() });
            await db.from('messages').insert([{ username: myUsername, content: content, room_id: currentDept }]);
        }

        async function deleteMsg(id) {
            if(confirm('حذف الرسالة؟')) {
                await db.from('messages').delete().eq('id', id);
                const el = document.getElementById('msg-' + id);
                if(el) el.remove();
            }
        }

        function addEmoji(emoji) {
            document.getElementById('chat-input').value += ' ' + emoji;
        }

        async function toggleRecording() {
            const btn = document.getElementById('record-btn');
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                btn.innerText = "🎙️";
                btn.style.backgroundColor = "#6366f1";
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        recordedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        sendMessage();
                    };
                    mediaRecorder.start();
                    btn.innerText = "⏹️";
                    btn.style.backgroundColor = "#ef4444";
                } catch (e) { alert('برجاء تفعيل صلاحية تسجيل الصوت'); }
            }
        }

        async function handleFileUpload(input) {
            if(input.files && input.files[0]) {
                const file = input.files[0];
                const fileName = `factory_${Date.now()}_${file.name}`;
                const { data, error } = await db.storage.from('chat-files').upload(fileName, file);
                if(!error) {
                    const res = db.storage.from('chat-files').getPublicUrl(fileName);
                    sendPayload(`[FILE]:${res.data.publicUrl}`);
                }
            }
        }

        function renderTeamTable() {
            const tbody = document.getElementById('team-table-body');
            tbody.innerHTML = '';
            teamMembers.forEach(m => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${m.name}</strong></td>
                    <td>${m.role}</td>
                    <td>${getDeptLabel(m.dept)}</td>
                    <td><button style="background:var(--danger-color); color:#fff; border:none; padding:3px 6px; border-radius:4px; font-size:0.7rem;" onclick="removeMember(${m.id})">إزالة</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function getDeptLabel(key) {
            const map = { production: 'الإنتاج', qc_qa: 'الجودة', inventory: 'المخازن', admin_hr: 'HR', finance: 'المالية' };
            return map[key] || key;
        }

        function addNewMember() {
            const name = document.getElementById('new-user-name').value.trim();
            const role = document.getElementById('new-user-role').value.trim();
            const dept = document.getElementById('new-user-dept').value;

            if(!name || !role) return alert('أدخل بيانات الموظف كاملة');

            teamMembers.push({ id: Date.now(), name, role, dept });
            renderTeamTable();
            document.getElementById('new-user-name').value = '';
            document.getElementById('new-user-role').value = '';
            alert(`تمت إضافة (${name}) بنجاح.`);
        }

        function removeMember(id) {
            if(confirm('حذف الموظف من النظام؟')) {
                teamMembers = teamMembers.filter(m => m.id !== id);
                renderTeamTable();
            }
        }

        function openVideoCall() { showPanel('video-panel'); }

        async function startCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('groupVideoPlayer').srcObject = localStream;
            } catch(e) { alert('تعذر الوصول للكاميرا'); }
        }

        function stopCamera() {
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            document.getElementById('groupVideoPlayer').srcObject = null;
            showPanel('chat-panel');
        }

        initApp();
    </script>
</body>
</html>
