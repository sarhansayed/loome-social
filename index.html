<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loome Social</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1 id="app-title">لومي سبيس</h1>
            <select id="language-select">
                <option value="ar">العربية</option>
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="ru">Русский</option>
                <option value="zh">中文</option>
                <option value="de">Deutsch</option>
            </select>
        </header>

        <!-- واجهة الدخول -->
        <main id="auth-container" class="card">
            <h2 id="auth-title">تسجيل الدخول</h2>
            <form id="auth-form">
                <div class="form-group">
                    <label id="label-email">البريد الإلكتروني</label>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label id="label-password">كلمة المرور</label>
                    <input type="password" id="password" required placeholder="******">
                </div>
                <button type="submit" id="btn-submit">تسجيل الدخول</button>
            </form>

            <div style="margin: 15px 0; text-align: center;">أو</div>

            <!-- زر الدخول كزائر الفوري -->
            <button id="btn-anon" type="button" style="background-color: #4A5568; color: white; width: 100%;">الدخول كزائر (بدون حساب)</button>

            <p id="auth-toggle-text" style="margin-top: 15px;">
                <span id="toggle-msg">ليس لديك حساب؟</span> 
                <a href="#" id="toggle-auth">إنشاء حساب جديد</a>
            </p>
            <p id="auth-error" class="error-msg" style="display:none; color: red; margin-top: 10px;"></p>
        </main>

        <!-- الواجهة الرئيسية -->
        <main id="main-content" class="card" style="display: none;">
            <h2 id="welcome-msg">مرحباً بك في لومي سبيس!</h2>
            <p id="status-msg">تم تسجيل الدخول بنجاح. سنبدأ الآن ببرمجة المنشورات والدردشة.</p>
            <button id="btn-logout">تسجيل الخروج</button>
        </main>
    </div>

    <script src="supabase-config.js"></script>
    <script src="i18n.js"></script>
    <script src="app.js"></script>
</body>
</html>
