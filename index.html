<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loome Social Pro</title>
    <!-- مكتبة الربط المباشر مع Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent-color: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { height: 56px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
        .header-title { font-size: 1rem; font-weight: bold; color: var(--accent-color); }
        .main-content { flex: 1; position: relative; overflow: hidden; }
        .view-panel { display: none; width: 100%; height: 100%; padding: 12px; overflow-y: auto; position: absolute; }
        .view-panel.active { display: flex; flex-direction: column; }
        .bottom-nav { height: 60px; background: var(--bg-secondary); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; }
        .nav-btn { background: transparent; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; cursor: pointer; width: 25%; }
        .nav-btn.active { color: var(--accent-color); font-weight: bold; }
        
        input, select { width: 100%; background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px; border-radius: 8px; outline: none; }
        .btn-primary { background: var(--accent-color); color: white; border: none; padding: 10px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: var(--danger-color); color: white; border: none; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
        
        .chat-box { display: flex; flex-direction: column; height: 100%; gap: 10px; }
        .messages-list { flex: 1; background: var(--bg-secondary); border-radius: 10px; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--border-color); }
        .msg-bubble { background: var(--border-color); padding: 10px; border-radius: 10px; max-width: 85%; font-size: 0.9rem; align-self: flex-start; }
        .msg-bubble.self { align-self: flex-end; background: #1e3a8a; }
        
        .video-card { background: #0284c7; color: white; padding: 10px; border-radius: 8px; margin-top: 5px; }
        #groupVideoPlayer { width: 100%; max-height: 60%; background: #000; border-radius: 10px; object-fit: cover; }
        .card { background: var(--bg-secondary); padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 10px; }
        .room-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 8px; }
    </style>
</head>
<body>

    <header>
        <div class="header-title" id="page-title">الدردشة العامة</div>
        <button class="btn-primary" style="background: var(--success-color);" onclick="startContextVideo()">📹 بث فيديو مباشر</button>
    </header>

    <div class="main-content">
        <!-- شاشة الشات والخصوصية -->
        <div id="chat-view" class="view-panel active">
            <div class="chat-box">
                <div class="messages-list" id="chat-msgs"></div>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="chat-input" placeholder="اكتب رسالتك...">
                    <button class="btn-primary" onclick="sendMessage()">إرسال</button>
                </div>
            </div>
        </div>

        <!-- إدارة الغرف المنفصلة -->
        <div id="rooms" class="view-panel">
            <div class="card">
                <h4 style="margin-bottom:8px;">إنشاء غرفة خاصة منفصلة</h4>
                <div style="display:flex; gap:6px;">
                    <input type="text" id="new-room-name" placeholder="اسم الغرفة...">
                    <button class="btn-primary" onclick="createRoom()">إنشاء</button>
                </div>
            </div>
            <div class="card" style="flex:1;">
                <h4 style="margin-bottom:8px;">الغرف المتاحة</h4>
                <div id="rooms-list">
                    <div class="room-item">
                        <button style="background:none; border:none; color:var(--accent-color); font-weight:bold;" onclick="switchRoom('public', 'الدردشة العامة')">💬 الغرفة العامة</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- شاشة البث المباشر المفتوح للجميع -->
        <div id="video-call" class="view-panel">
            <div style="display:flex; flex-direction:column; align-items:center; gap:10px; height:100%;">
                <div id="video-status" style="font-size:0.85rem; color:var(--text-muted);">البث الجماعي المباشر</div>
                <video id="groupVideoPlayer" autoplay playsinline muted></video>
                <div style="display:flex; gap:10px;">
                    <button class="btn-primary" style="background:var(--success-color);" onclick="toggleCameraStream()">تفعيل الكاميرا والمايك</button>
                    <button class="btn-danger" onclick="stopVideoSession()">إغلاق البث</button>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn active" onclick="switchRoom('public', 'الدردشة العامة')">💬<span>العامة</span></button>
        <button class="nav-btn" onclick="switchView('rooms')">🚪<span>الغرف</span></button>
        <button class="nav-btn" onclick="switchView('video-call')">📹<span>الفيديو</span></button>
    </div>

    <script>
        // ضع هنا رابط ومفتاح Supabase الخاص بك ليتحول الملف فوراً لموقع متصل بين الأجهزة
        const SUPABASE_URL = 'https://YOUR_SUPABASE_URL.supabase.co';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        let supabase = (SUPABASE_URL.includes('YOUR_')) ? null : supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentRoomId = 'public';
        let localStream = null;

        function switchView(id) {
            document.querySelectorAll('.view-panel').forEach(e => e.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function switchRoom(roomId, title) {
            currentRoomId = roomId;
            document.getElementById('page-title').innerText = title;
            switchView('chat-view');
            loadMessages();
        }

        async function loadMessages() {
            const container = document.getElementById('chat-msgs');
            container.innerHTML = '';
            
            if(supabase) {
                let { data: msgs } = await supabase.from('messages').select('*').eq('room_id', currentRoomId);
                (msgs || []).forEach(msg => appendMsgUI(msg));
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            if(!input.value.trim()) return;

            const msgData = { room_id: currentRoomId, sender: 'أنت', content: input.value.trim() };
            
            if(supabase) {
                await supabase.from('messages').insert([msgData]);
            } else {
                appendMsgUI(msgData);
            }
            input.value = '';
        }

        function appendMsgUI(msg) {
            const container = document.getElementById('chat-msgs');
            const bubble = document.createElement('div');
            bubble.className = `msg-bubble ${msg.sender === 'أنت' ? 'self' : ''}`;
            bubble.innerHTML = `<strong>${msg.sender}:</strong> ${msg.content || ''}`;
            if(msg.is_video) {
                bubble.innerHTML += `<div class="video-card">📹 تم بدء بث مباشر <br><button class="btn-primary" style="background:#fff; color:#000; margin-top:5px;" onclick="switchView('video-call')">انضمام للمشاهدة والتحدث</button></div>`;
            }
            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight;
        }

        function createRoom() {
            const name = document.getElementById('new-room-name').value.trim();
            if(!name) return;
            const roomId = 'room-' + Date.now();
            
            const list = document.getElementById('rooms-list');
            const item = document.createElement('div');
            item.className = 'room-item';
            item.innerHTML = `<button style="background:none; border:none; color:var(--accent-color); font-weight:bold;" onclick="switchRoom('${roomId}', '${name}')">🔒 ${name}</button>`;
            list.appendChild(item);
            
            document.getElementById('new-room-name').value = '';
            switchRoom(roomId, name);
        }

        async function startContextVideo() {
            const msgData = { room_id: currentRoomId, sender: 'أنت', content: 'بدأ بثاً مباشراً', is_video: true };
            if(supabase) await supabase.from('messages').insert([msgData]);
            else appendMsgUI(msgData);
            
            switchView('video-call');
            toggleCameraStream();
        }

        async function toggleCameraStream() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('groupVideoPlayer').srcObject = localStream;
            } catch(e) {
                alert('عذراً، يجب السماح باستخدام الكاميرا والمايكرفون.');
            }
        }

        function stopVideoSession() {
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            document.getElementById('groupVideoPlayer').srcObject = null;
            switchView('chat-view');
        }
    </script>
</body>
</html>
