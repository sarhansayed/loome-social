<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق التواصل المتكامل</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent-color: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* Top Header */
        header {
            height: 56px;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .quick-call-btn {
            background-color: var(--success-color);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Main Content View Container */
        .main-content {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .view-panel {
            display: none;
            width: 100%;
            height: 100%;
            padding: 12px;
            overflow-y: auto;
            position: absolute;
            top: 0;
            left: 0;
        }

        .view-panel.active {
            display: flex;
            flex-direction: column;
        }

        /* Bottom Navigation Bar for Mobile */
        .bottom-nav {
            height: 60px;
            background-color: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-shrink: 0;
            z-index: 100;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75rem;
            gap: 3px;
            cursor: pointer;
            width: 25%;
            padding: 6px 0;
        }

        .nav-btn .icon {
            font-size: 1.2rem;
        }

        .nav-btn.active {
            color: var(--accent-color);
            font-weight: bold;
        }

        /* Form Inputs & Controls */
        input[type="text"], select, textarea {
            width: 100%;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 0.95rem;
        }

        /* Public Chat Layout */
        .chat-box {
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 10px;
        }

        .messages-list {
            flex: 1;
            background-color: var(--bg-secondary);
            border-radius: 10px;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid var(--border-color);
        }

        .msg-bubble {
            background-color: var(--border-color);
            padding: 8px 12px;
            border-radius: 12px;
            max-width: 85%;
            font-size: 0.9rem;
            align-self: flex-start;
        }

        .msg-bubble.self {
            align-self: flex-end;
            background-color: var(--accent-color);
        }

        .chat-input-row {
            display: flex;
            gap: 8px;
        }

        .chat-input-row input {
            margin-top: 0;
        }

        .chat-input-row button {
            width: auto;
            padding: 0 18px;
        }

        /* Private Chat Mobile Layout */
        .pm-card {
            background-color: var(--bg-secondary);
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
        }

        /* Video Call Mobile Layout */
        .video-wrapper {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Responsive Canvas Game */
        .game-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 12px;
        }

        #gameCanvas {
            background-color: var(--bg-secondary);
            border: 2px solid var(--accent-color);
            border-radius: 10px;
            max-width: 100%;
            touch-action: none;
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--accent-color);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: none;
            z-index: 200;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-title" id="page-title">الدردشة العامة</div>
        <button class="quick-call-btn" onclick="switchView('video-call')">
            <span>📹</span> فيديو مباشر
        </button>
    </header>

    <!-- Main Screens Area -->
    <div class="main-content">

        <!-- 1. Public Chat Panel -->
        <div id="public-chat" class="view-panel active">
            <div class="chat-box">
                <div class="messages-list" id="public-msgs">
                    <div class="msg-bubble">مرحباً بك في الغرفة العامة!</div>
                </div>
                <div class="chat-input-row">
                    <input type="text" id="public-input" placeholder="اكتب رسالتك...">
                    <button class="btn-primary" onclick="sendPublicMsg()">إرسال</button>
                </div>
            </div>
        </div>

        <!-- 2. Private Chat Panel -->
        <div id="private-chat" class="view-panel">
            <div class="pm-card">
                <h3>إرسال رسالة خاصة</h3>
                <div>
                    <label style="font-size: 0.85rem; color: var(--text-muted);">المستلم:</label>
                    <select id="pm-recipient">
                        <option value="أحمد (مدير)">أحمد (مدير)</option>
                        <option value="سارة (دعم)">سارة (دعم)</option>
                        <option value="علي (مطور)">علي (مطور)</option>
                    </select>
                </div>
                <div>
                    <label style="font-size: 0.85rem; color: var(--text-muted);">الرسالة:</label>
                    <textarea id="pm-text" rows="3" placeholder="اكتب رسالتك هنا..."></textarea>
                </div>
                <button class="btn-primary" onclick="sendPrivateMsg()">إرسال الآن</button>
            </div>

            <div class="pm-card" style="flex:1; overflow-y:auto;">
                <h3>سجل الرسائل الخاصة</h3>
                <div id="pm-list" style="margin-top: 8px; display: flex; flex-direction: column; gap: 8px;"></div>
            </div>
        </div>

        <!-- 3. Video Call Panel -->
        <div id="video-call" class="view-panel" style="padding: 0;">
            <div class="video-wrapper">
                <iframe src="https://meet.jit.si/ProAppIntegratedRoomRoom2026#config.prejoinPageEnabled=false" allow="camera; microphone; fullscreen; display-capture"></iframe>
            </div>
        </div>

        <!-- 4. Game Panel -->
        <div id="game" class="view-panel">
            <div class="game-box">
                <div style="display: flex; justify-content: space-between; width: 100%; max-width: 320px; align-items: center;">
                    <span style="font-weight: bold;">النقاط: <span id="score-val" style="color:var(--accent-color)">0</span></span>
                    <button class="btn-primary" style="width: auto; padding: 6px 14px;" onclick="startGame()">بدء اللعبة</button>
                </div>
                <canvas id="gameCanvas" width="320" height="360"></canvas>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <button class="nav-btn active" id="btn-public" onclick="switchView('public-chat')">
            <span class="icon">💬</span>
            <span>العامة</span>
        </button>
        <button class="nav-btn" id="btn-private" onclick="switchView('private-chat')">
            <span class="icon">🔒</span>
            <span>خاص</span>
        </button>
        <button class="nav-btn" id="btn-video" onclick="switchView('video-call')">
            <span class="icon">📹</span>
            <span>فيديو</span>
        </button>
        <button class="nav-btn" id="btn-game" onclick="switchView('game')">
            <span class="icon">🎮</span>
            <span>الاستراحة</span>
        </button>
    </div>

    <div class="toast" id="toast">تنبيه</div>

    <script>
        // Tab Switcher Logic
        function switchView(viewId) {
            document.querySelectorAll('.view-panel').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(viewId).classList.add('active');

            const titleMap = {
                'public-chat': 'الدردشة العامة',
                'private-chat': 'الرسائل الخاصة',
                'video-call': 'اجتماع الفيديو المباشر',
                'game': 'مركز الألعاب'
            };
            document.getElementById('page-title').innerText = titleMap[viewId];

            const navMap = {
                'public-chat': 'btn-public',
                'private-chat': 'btn-private',
                'video-call': 'btn-video',
                'game': 'btn-game'
            };
            if(navMap[viewId]) {
                document.getElementById(navMap[viewId]).classList.add('active');
            }

            if(viewId === 'game') {
                initGame();
            }
        }

        // Public Chat Function
        function sendPublicMsg() {
            const input = document.getElementById('public-input');
            if(!input.value.trim()) return;

            const box = document.getElementById('public-msgs');
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble self';
            bubble.innerText = input.value;
            box.appendChild(bubble);

            input.value = '';
            box.scrollTop = box.scrollHeight;
        }

        // Private Msg Function
        function sendPrivateMsg() {
            const recipient = document.getElementById('pm-recipient').value;
            const text = document.getElementById('pm-text').value;
            if(!text.trim()) return;

            const list = document.getElementById('pm-list');
            const card = document.createElement('div');
            card.style.backgroundColor = 'var(--bg-primary)';
            card.style.padding = '8px 12px';
            card.style.borderRadius = '6px';
            card.style.fontSize = '0.85rem';
            card.innerHTML = `<strong style="color:var(--accent-color)">إلى ${recipient}:</strong><p style="margin-top:2px;">${text}</p>`;

            list.prepend(card);
            document.getElementById('pm-text').value = '';
            showToast('تم إرسال الرسالة الخاصة!');
        }

        // Game Engine (Mobile Friendly)
        let canvas, ctx;
        let target = { x: 50, y: 50, r: 22 };
        let score = 0;
        let isPlaying = false;

        function initGame() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');

            // Handle touch and click identically
            const handleTap = (e) => {
                if(!isPlaying) return;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const x = clientX - rect.left;
                const y = clientY - rect.top;

                const dist = Math.hypot(x - target.x, y - target.y);
                if(dist <= target.r) {
                    score += 10;
                    document.getElementById('score-val').innerText = score;
                    moveTarget();
                }
            };

            canvas.onclick = handleTap;
            canvas.ontouchstart = (e) => { e.preventDefault(); handleTap(e); };
            drawTarget();
        }

        function startGame() {
            score = 0;
            document.getElementById('score-val').innerText = score;
            isPlaying = true;
            moveTarget();
            showToast('اضغط على الدائرة الحمراء!');
        }

        function moveTarget() {
            target.x = Math.random() * (canvas.width - 60) + 30;
            target.y = Math.random() * (canvas.height - 60) + 30;
            drawTarget();
        }

        function drawTarget() {
            if(!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.arc(target.x, target.y, target.r, 0, Math.PI * 2);
            ctx.fillStyle = '#ef4444';
            ctx.fill();
            ctx.closePath();
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2500);
        }
    </script>
</body>
</html>
