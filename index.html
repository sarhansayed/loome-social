<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loome Social Pro - Auth</title>
    <!-- مكتبة الاتصال المباشر بقواعد بيانات Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent-color: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-primary); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
        
        /* واجهة تسجيل الدخول */
        #auth-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-primary);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        header { height: 56px; background-color: var(--bg-secondary); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; flex-shrink: 0; }
        .header-title { font-size: 0.95rem; font-weight: bold; color: var(--accent-color); }
        .main-content { flex: 1; position: relative; overflow: hidden; }
        .view-panel { display: none; width: 100%; height: 100%; padding: 12px; overflow-y: auto; position: absolute; top: 0; left: 0; }
        .view-panel.active { display: flex; flex-direction: column; }
        .bottom-nav { height: 60px; background-color: var(--bg-secondary); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; flex-shrink: 0; z-index: 100; }
        .nav-btn { background: transparent; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; gap: 3px; cursor: pointer; width: 25%; }
        .nav-btn.active { color: var(--accent-color); font-weight: bold; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; background-color: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px; border-radius: 8px; outline: none; font-size: 0.9rem; }
        .btn-primary { background-color: var(--accent-color); color: white; border: none; padding: 10px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-danger { background-color: var(--danger-color); color: white; border: none; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
        .btn-audio { background-color: #8b5cf6; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 1rem; cursor: pointer; }
        .chat-box { display: flex; flex-direction: column; height: 100%; gap: 10px; }
        .messages-list { flex: 1; background-color: var(--bg-secondary); border-radius: 10px; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--border-color); }
        .msg-bubble { background-color: var(--border-color); padding: 10px; border-radius: 10px; max-width: 85%; font-size: 0.9rem; align-self: flex-start; display: flex; flex-direction: column; gap: 6px; }
        .msg-bubble.self { align-self: flex-end; background-color: #1e3a8a; }
        .file-attach-btn { background: #334155; color: #fff; padding: 8px 12px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; font-size: 1.1rem; }
        .video-broadcast-card { background: #0284c7; color: white; padding: 10px; border-radius: 8px; display: flex; flex-direction: column; gap: 6px; }
        #groupVideoPlayer { width: 100%; max-height: 60%; background: #000; border-radius: 10px; object-fit: cover; }
        .card { background-color: var(--bg-secondary); padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 10px; }
        .room-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background-color: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 8px; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول وإنشاء الحساب -->
    <div id="auth-screen">
        <div class="auth-card">
            <h2 style="text-align: center; color: var(--accent-color);">تسجيل الدخول</h2>
            <input type="email" id="auth-email" placeholder="البريد الإلكتروني (Email)...">
            <input type="password" id="auth-password" placeholder="كلمة السر (Password)...">
            <button class="btn-primary" onclick="handleLogin()">تسجيل الدخول</button>
            <button class="btn-primary" style="background-color: #475569;" onclick="handleSignUp()">إنشاء حساب جديد</button>
            <div id="auth-error" style="color: var(--danger-color); font-size: 0.8rem; text-align: center;"></div>
        </div>
    </div>

    <!-- الواجهة الرئيسية بعد تسجيل الدخول -->
    <header>
        <div class="header-title" id="page-title">الدردشة العامة</div>
        <div style="display: flex; gap: 6px; align-items: center;">
            <button class="btn-primary" style="padding: 4px 10px; font-size: 0.8rem; background: var(--success-color);" onclick="startContextVideo()">📹 فيديو جماعي</button>
            <button class="btn-danger" onclick="handleLogout()">خروج</button>
        </div>
    </header>

    <div class="main-content">
        <!-- 1. شاشة الشات والرسائل -->
        <div id="chat-view" class="view-panel active">
            <div class="chat-box">
                <div class="messages-list" id="chat-msgs"></div>
                <div style="display: flex; gap: 6px; align-items: center;">
                    <label class="file-attach-btn" title="إرفاق ملف">
                        📎
                        <input type="file" id="chat-file" style="display:none;" onchange="handleFileUpload(this)">
                    </label>
                    <button id="record-btn" class="btn-audio" onclick="toggleRecording()" title="تسجيل صوت">🎙️</button>
                    <input type="text" id="chat-input" placeholder="اكتب رسالتك...">
                    <button class="btn-primary" onclick="sendMessage()">إرسال</button>
                </div>
            </div>
        </div>

        <!-- 2. المحادثات الخاصة -->
        <div id="private-contacts" class="view-panel">
            <div class="card">
                <h4 style="margin-bottom:8px;">محادثة خاصة جديدة</h4>
                <input type="email" id="pm-user-email" placeholder="اكتب بريد المستلم..." style="margin-bottom:8px;">
                <button class="btn-primary" onclick="openPrivateChat()">فتح المحادثة الخاصة</button>
            </div>
        </div>

        <!-- 3. إدارة الغرف المنفصلة كلياً -->
        <div id="rooms" class="view-panel">
            <div class="card">
                <h4 style="margin-bottom:8px;">إنشاء غرفة منفصلة</h4>
                <div style="display:flex; gap:6px;">
                    <input type="text" id="new-room-name" placeholder="اسم الغرفة...">
                    <button class="btn-primary" onclick="createRoom()">إنشاء</button>
                </div>
            </div>
            <div class="card" style="flex:1;">
                <h4 style="margin-bottom:8px;">الغرف المتاحة</h4>
                <div id="rooms-list">
                    <div class="room-item">
                        <button style="background:none; border:none; color:var(--accent-color); font-weight:bold;" onclick="switchRoom('public', 'الدردشة العامة')">💬 الغرفة العامة</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. غرف البث والفيديو الجماعي -->
        <div id="video-call" class="view-panel">
            <div style="display:flex; flex-direction:column; align-items:center; gap:10px; height:100%;">
                <div id="video-status" style="font-size:0.85rem; color:var(--text-muted);">البث الجماعي المباشر عبر الإنترنت</div>
                <video id="groupVideoPlayer" autoplay playsinline muted></video>
                <div style="display:flex; gap:10px;">
                    <button class="btn-primary" style="background:var(--success-color);" onclick="toggleCameraStream()">تفعيل الكاميرا/المايك</button>
                    <button class="btn-danger" onclick="stopVideoSession()">إغلاق البث</button>
                </div>
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="bottom-nav">
        <button class="nav-btn active" id="btn-public" onclick="switchRoom('public', 'الدردشة العامة')"><span>💬</span><span>العامة</span></button>
        <button class="nav-btn" id="btn-private" onclick="switchView('private-contacts')"><span>🔒</span><span>خاص</span></button>
        <button class="nav-btn" id="btn-rooms" onclick="switchView('rooms')"><span>🚪</span><span>الغرف</span></button>
        <button class="nav-btn" id="btn-video" onclick="switchView('video-call')"><span>📹</span><span>الفيديو</span></button>
    </div>

    <script>
        const SUPABASE_URL = 'https://gdmevluvrmexkkihcxce.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkbWV2bHV2cm1leGtraWhjeGNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NTI5ODIsImV4cCI6MjEwNDEyODk4Mn0.U1MA6q_GfuPpzkJCvMwTc07neAek1vsq5qWE44_eYQQ';

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentRoomId = 'public';
        let currentUser = null;
        let mediaRecorder = null, audioChunks = [], recordedAudioBlob = null;
        let localVideoStream = null;

        // التحقق من الجلسة عند فتح التطبيق
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                currentUser = session.user;
                document.getElementById('auth-screen').style.display = 'none';
                switchRoom('public', 'الدردشة العامة');
            }
        });

        // التعامل مع تسجيل الدخول
        async function handleLogin() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errDiv = document.getElementById('auth-error');
            errDiv.innerText = '';

            const { data, error } = await db.auth.signInWithPassword({ email, password });
            if (error) {
                errDiv.innerText = 'خطأ في تسجيل الدخول: ' + error.message;
            } else {
                currentUser = data.user;
                document.getElementById('auth-screen').style.display = 'none';
                switchRoom('public', 'الدردشة العامة');
            }
        }

        // التعامل مع إنشاء حساب جديد
        async function handleSignUp() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errDiv = document.getElementById('auth-error');
            errDiv.innerText = '';

            const { data, error } = await db.auth.signUp({ email, password });
            if (error) {
                errDiv.innerText = 'خطأ في إنشاء الحساب: ' + error.message;
            } else {
                alert('تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.');
            }
        }

        // تسجيل الخروج
        async function handleLogout() {
            await db.auth.signOut();
            currentUser = null;
            document.getElementById('auth-screen').style.display = 'flex';
        }

        function switchView(id) {
            document.querySelectorAll('.view-panel').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(e => e.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function switchRoom(roomId, title) {
            currentRoomId = roomId;
            document.getElementById('page-title').innerText = title;
            switchView('chat-view');
            loadMessages();
            listenRealtime();
        }

        async function loadMessages() {
            const container = document.getElementById('chat-msgs');
            container.innerHTML = '';

            try {
                const { data, error } = await db.from('messages').select('*').eq('room_id', currentRoomId).order('created_at', { ascending: true });
                if(!error && data) {
                    data.forEach(msg => renderMessageUI(msg));
                }
            } catch(e) {
                console.log('جاري تهيئة قاعدة البيانات...');
            }
            container.scrollTop = container.scrollHeight;
        }

        function listenRealtime() {
            db.channel('realtime:messages')
              .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                  if(payload.new.room_id === currentRoomId) {
                      renderMessageUI(payload.new);
                      const container = document.getElementById('chat-msgs');
                      container.scrollTop = container.scrollHeight;
                  }
              }).subscribe();
        }

        function renderMessageUI(msg) {
            const container = document.getElementById('chat-msgs');
            const bubble = document.createElement('div');
            const myEmail = currentUser ? currentUser.email : '';
            bubble.className = `msg-bubble ${msg.sender === myEmail ? 'self' : ''}`;
            
            let html = `<div><strong>${msg.sender}:</strong> ${msg.content || ''}</div>`;
            if(msg.audio_url) html += `<audio controls src="${msg.audio_url}"></audio>`;
            if(msg.file_url) html += `<a href="${msg.file_url}" target="_blank" style="color:#60a5fa;">📄 عرض الملف المرفق</a>`;
            if(msg.is_video) {
                html += `
                    <div class="video-broadcast-card">
                        <span>📹 تم بدء بث مباشر في هذه الغرفة</span>
                        <button class="btn-primary" style="background:#fff; color:#000; font-size:0.8rem; margin-top:4px;" onclick="switchView('video-call')">انضمام للمشاهدة والتحدث</button>
                    </div>
                `;
            }
            bubble.innerHTML = html;
            container.appendChild(bubble);
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            if(!input.value.trim() && !recordedAudioBlob) return;

            let audioUrl = null;
            if(recordedAudioBlob) {
                const fileName = `audio_${Date.now()}.mp3`;
                const { data } = await db.storage.from('chat-attachments').upload(fileName, recordedAudioBlob);
                if(data) {
                    const res = db.storage.from('chat-attachments').getPublicUrl(fileName);
                    audioUrl = res.data.publicUrl;
                }
            }

            const msgData = {
                room_id: currentRoomId,
                sender: currentUser ? currentUser.email : 'مستخدم مجهول',
                content: input.value.trim(),
                audio_url: audioUrl
            };

            await db.from('messages').insert([msgData]);

            input.value = '';
            recordedAudioBlob = null;
        }

        async function toggleRecording() {
            const btn = document.getElementById('record-btn');
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                btn.innerText = "🎙️";
                btn.style.backgroundColor = "#8b5cf6";
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        recordedAudioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        alert('تم تسجيل المقطع الصوتي، اضغط إرسال.');
                    };
                    mediaRecorder.start();
                    btn.innerText = "⏹️";
                    btn.style.backgroundColor = "#ef4444";
                } catch (e) { alert('الرجاء السماح بالوصول للميكروفون'); }
            }
        }

        async function handleFileUpload(input) {
            if(input.files && input.files[0]) {
                const file = input.files[0];
                const fileName = `file_${Date.now()}_${file.name}`;
                const { data } = await db.storage.from('chat-attachments').upload(fileName, file);
                
                if(data) {
                    const res = db.storage.from('chat-attachments').getPublicUrl(fileName);
                    await db.from('messages').insert([{
                        room_id: currentRoomId,
                        sender: currentUser ? currentUser.email : 'مستخدم مجهول',
                        content: `مرفق ملف: ${file.name}`,
                        file_url: res.data.publicUrl
                    }]);
                }
            }
        }

        function createRoom() {
            const nameInput = document.getElementById('new-room-name');
            if(!nameInput.value.trim()) return;
            const roomId = 'room-' + Date.now();
            const roomName = nameInput.value.trim();

            const list = document.getElementById('rooms-list');
            const item = document.createElement('div');
            item.className = 'room-item';
            item.innerHTML = `<button style="background:none; border:none; color:var(--accent-color); font-weight:bold;" onclick="switchRoom('${roomId}', '${roomName}')">🔒 ${roomName}</button>`;
            list.appendChild(item);
            
            nameInput.value = '';
            switchRoom(roomId, roomName);
        }

        function openPrivateChat() {
            const userEmail = document.getElementById('pm-user-email').value.trim();
            if(userEmail) switchRoom('pm_' + userEmail, 'محادثة خاصة: ' + userEmail);
        }

        async function startContextVideo() {
            await db.from('messages').insert([{
                room_id: currentRoomId,
                sender: currentUser ? currentUser.email : 'مستخدم مجهول',
                content: 'بدأ بث فيديو مباشر',
                is_video: true
            }]);
            switchView('video-call');
            toggleCameraStream();
        }

        async function toggleCameraStream() {
            try {
                localVideoStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('groupVideoPlayer').srcObject = localVideoStream;
            } catch(e) { alert('الرجاء تفعيل الكاميرا والمايك من إعدادات المتصفح'); }
        }

        function stopVideoSession() {
            if(localVideoStream) localVideoStream.getTracks().forEach(t => t.stop());
            document.getElementById('groupVideoPlayer').srcObject = null;
            switchView('chat-view');
        }
    </script>
</body>
</html>
