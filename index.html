<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loome Social</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js" defer></script>
</head>
<body>
    <div class="container">
        <!-- شاشة تسجيل الدخول -->
        <div id="auth-container">
            <h2 id="auth-title">تسجيل الدخول</h2>
            <form id="auth-form">
                <input type="email" id="email" placeholder="البريد الإلكتروني" required>
                <input type="password" id="password" placeholder="كلمة المرور" required>
                <button type="submit" id="btn-submit">تسجيل الدخول</button>
            </form>
            <p>أو</p>
            <button id="btn-anon" style="width: 100%; background-color: #555; color: white; padding: 10px; margin-bottom: 10px;">الدخول كزائر (بدون حساب)</button>
            <p><span id="toggle-msg">ليس لديك حساب؟</span> <a href="#" id="toggle-auth">إنشاء حساب جديد</a></p>
            <div id="auth-error" style="color: red; display: none; margin-top: 10px;"></div>
        </div>

        <!-- الشاشة الرئيسية والمنشورات -->
        <div id="main-content" style="display: none;">
            <h2>مرحباً بك في لومي سبيس!</h2>
            
            <!-- صندوق إضافة منشور -->
            <div style="margin-top: 20px;">
                <textarea id="post-input" placeholder="بماذا تفكر اليوم؟" style="width: 100%; height: 80px; padding: 10px; box-sizing: border-box;"></textarea>
                <button id="btn-post" style="margin-top: 10px; padding: 10px 20px; cursor: pointer; width: 100%;">نشر المنشور</button>
            </div>

            <hr style="margin: 20px 0;">

            <!-- قائمة المنشورات -->
            <h3>المنشورات الأخيرة</h3>
            <div id="posts-container">جاري تحميل المنشورات...</div>

            <button id="btn-logout" style="margin-top: 30px; background-color: #d9534f; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">تسجيل الخروج</button>
        </div>
    </div>
</body>
</html>
